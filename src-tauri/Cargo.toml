[package]
name = "whiteaesther"
version = "1.7.1"
description = "Cross-platform desktop client for the Aether connection core"
authors = ["WhiteDNS"]
# WhiteAesther links the Aether engine, which is AGPL-3.0, so it is a derivative
# work and carries the same licence. See THIRD_PARTY_NOTICES.md.
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whiteaesther_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# The chain's control-API password. Guessing it means being able to
# reconfigure routing, so it comes from the OS rather than from the clock.
getrandom = "0.3"
# A second copy knows nothing about the first: it reports "Not connected" over a
# live tunnel, and its startup recovery reverts the system proxy the first one
# applied -- taking the running session off the network from the outside.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System proxy control. Both are already in the tree via Tauri; naming them here
# only adds the dependency edge.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinInet",
    # Full tunnel needs a network adapter, which needs an elevated process:
    # these are what ask for one and what check whether we already have it.
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Threading",
    # Letting an ordinary launch reach an elevated copy: see
    # elevation::allow_launches_from_an_ordinary_user.
    "Win32_UI_WindowsAndMessaging",
] }
