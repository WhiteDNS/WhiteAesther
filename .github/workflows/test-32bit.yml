name: Test Windows 32-bit Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-32bit:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust 32-bit target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check Windows 32-bit compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --target i686-pc-windows-msvc
